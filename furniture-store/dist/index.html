<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple furniture store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Simple Furniture Store</h1>
    <h2 class="myMoney"></h2>
    <input class="search-Priceitem" type="text" placeholder="Search for furniture...">
    <button onclick="searchFurniture()">Search item price </button>
    <div class="search-result">
        <p class="priceSet"></p>
    </div>

    <input class="buy-item" type="text" placeholder="Search for furniture...">
    <button onclick="buyItem()">buy item </button>
    <div>
        <p class="buySet"></p>
    </div>
    <script src="main.js"></script>
</body>

</html>
